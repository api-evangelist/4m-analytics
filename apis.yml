apis:
- name: 4M WFS API
  description: >-
    The 4M WFS API is an OGC Web Feature Service that streams 4M's validated
    subsurface utility data (line and point features) in real time into GIS
    platforms such as ArcGIS and QGIS, eliminating manual file downloads. Access
    is admin-gated: an organization admin requests access from their 4M Customer
    Success Manager, then generates an API key from within the 4Map application
    (initials menu, "Generate API Key"), optionally naming the link, setting an
    expiration, and choosing a data scope (all projects or a single folder).
    Generating the key returns a WFS endpoint URL for direct use in the GIS
    client. The base host and per-key endpoint are provisioned per organization
    and are not publicly published, so no fabricated baseURL is recorded here.
  humanURL: https://help.4manalytics.com/en/collections/3720127-api-and-integrations
