aid: 4m-analytics
name: 4M Analytics
description: >-
  4M Analytics is a utility AI mapping company that builds the "Google Maps of
  underground infrastructure." Its platform compiles millions of scattered
  public utility records into a single, validated subsurface map, using an AI
  conflation engine, satellite imagery, computer-vision object detection, and
  geospatial experts to identify known and unknown underground utilities before
  design and construction. Teams use 4M to speed utility record research,
  reduce excavation risk, and avoid costly conflicts during planning,
  pre-construction, and design. The platform exposes utility data through the
  4M web application (4Map) and a WFS (OGC Web Feature Service) API that streams
  line and point utility features directly into GIS and CAD tools (ArcGIS,
  QGIS, AutoCAD, Autodesk, Bentley), with exports to PDF, SHP, KML, GPKG, DWG,
  DXF, and DGN. Founded in 2019 (Austin, TX and Tel Aviv) and backed by Insight
  Partners, 4M is added to the API Evangelist network and enriched here.
